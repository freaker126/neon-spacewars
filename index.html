<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Freaker126 Neon Space Wars</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050508;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            touch-action: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #game-container {
            position: relative;
            width: 95vw;
            height: 70vh;
            max-width: 450px;
            max-height: 650px;
            background-color: #000;
            box-shadow: 0 0 20px #00ffff;
            overflow: hidden;
            border-radius: 8px;
            border: 2px solid #00ffff;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .ui-layer {
            position: absolute;
            top: 8px;
            left: 10px;
            right: 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            pointer-events: none;
            font-weight: bold;
            font-size: 12px;
            z-index: 5;
            text-shadow: 0 0 8px currentColor;
        }
        .ui-top-row {
            display: flex;
            justify-content: space-between;
            width: 100%;
        }
        .ui-score { color: #39ff14; }
        .ui-high { color: #00ffff; }
        .ui-bombs { color: #ff007f; }
        .ui-level { color: #ffff00; }
        
        .boss-hp-container {
            width: 100%;
            height: 10px;
            background: rgba(255, 0, 127, 0.2);
            border: 1px solid #ff007f;
            box-shadow: 0 0 8px #ff007f;
            display: none;
            position: relative;
        }
        .boss-hp-fill {
            width: 100%;
            height: 100%;
            background: #ff007f;
            box-shadow: 0 0 10px #ff007f;
            transition: width 0.1s ease-out;
        }
        .boss-hp-text {
            position: absolute;
            top: -2px;
            width: 100%;
            text-align: center;
            font-size: 9px;
            color: #fff;
            text-shadow: 0 0 4px #000;
        }

        .top-btn {
            position: absolute;
            top: 38px;
            right: 10px;
            z-index: 10;
            background: rgba(255, 0, 127, 0.2);
            border: 1px solid #ff007f;
            color: #fff;
            padding: 3px 6px;
            font-family: 'Courier New', monospace;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
            text-shadow: 0 0 5px #ff007f;
            box-shadow: 0 0 5px #ff007f;
        }
        
        /* Touch Controls directly inside the canvas box */
        .controls-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 4;
        }
        .left-touch-zone {
            position: absolute;
            bottom: 15px;
            left: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: auto;
        }
        .touch-btn {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(2px);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 10px;
            border: 2px solid;
            touch-action: none;
        }
        .btn-shoot {
            border-color: #39ff14;
            color: #39ff14;
            box-shadow: 0 0 8px rgba(57, 255, 20, 0.4);
        }
        .btn-shoot:active { background: rgba(57, 255, 20, 0.4); }
        .btn-bomb {
            border-color: #ff007f;
            color: #ff007f;
            box-shadow: 0 0 8px rgba(255, 0, 127, 0.4);
        }
        .btn-bomb:active { background: rgba(255, 0, 127, 0.4); }
        
        .right-touch-zone {
            position: absolute;
            bottom: 15px;
            right: 12px;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(0, 255, 255, 0.12);
            border: 2px dashed rgba(0, 255, 255, 0.4);
            pointer-events: auto;
            touch-action: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .joypad-stick {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgba(0, 255, 255, 0.4);
            border: 2px solid #00ffff;
            box-shadow: 0 0 8px #00ffff;
            pointer-events: none;
            transform: translate(0px, 0px);
        }
    </style>
</head>
<body>

<div id="game-container">
    <div class="ui-layer">
        <div class="ui-top-row">
            <div class="ui-score">SCORE: <span id="scoreVal">0</span></div>
            <div class="ui-level">LVL: <span id="levelVal">1</span></div>
            <div class="ui-high">HI: <span id="highVal">0</span></div>
            <div class="ui-bombs">BOMBS: <span id="bombVal">1</span></div>
        </div>
        <div class="boss-hp-container" id="bossBar">
            <div class="boss-hp-fill" id="bossHpFill"></div>
            <div class="boss-hp-text">BOSS HEALTH</div>
        </div>
    </div>

    <button class="top-btn" onclick="toggleAudio()">MUSIC: ON</button>

    <canvas id="spaceCanvas"></canvas>

    <div class="controls-layer">
        <div class="left-touch-zone">
            <div class="touch-btn btn-bomb" id="touchBomb">BOMB</div>
            <div class="touch-btn btn-shoot" id="touchShoot">FIRE</div>
        </div>
        <div class="right-touch-zone" id="joypadZone">
            <div class="joypad-stick" id="joystick"></div>
        </div>
    </div>
</div>

<script>
const container = document.getElementById("game-container");
const canvas = document.getElementById("spaceCanvas");
const ctx = canvas.getContext("2d");

function resizeCanvas() {
    canvas.width = container.clientWidth;
    canvas.height = container.clientHeight;
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

let score = 0;
let highScore = localStorage.getItem("freaker126_spacewars_high") || 0;
document.getElementById("highVal").innerText = highScore;

let gameState = "START";
let isMuted = false;
let waveLevel = 1;
let waveKills = 0;
const killsPerWave = 10;

let player;
let boss = null;
let warningTimer = 0;

let bullets = [];
let enemyBullets = [];
let enemies = [];
let particles = [];
let loots = [];
let stars = [];

for (let i = 0; i < 60; i++) {
    stars.push({
        x: Math.random() * 500,
        y: Math.random() * 800,
        size: Math.random() * 2 + 0.5,
        speed: Math.random() * 1.5 + 0.5
    });
}

let audioCtx = null;
let musicStep = 0;

const bassNotes = [110.00, 110.00, 130.81, 110.00, 146.83, 130.81, 164.81, 146.83];
const leadNotes = [220.00, 261.63, 293.66, 329.63, 392.00, 329.63, 293.66, 261.63];

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
}

function toggleAudio() {
    initAudio();
    isMuted = !isMuted;
    const btn = document.querySelector(".top-btn");
    btn.innerText = isMuted ? "MUSIC: OFF" : "MUSIC: ON";
}

function playSound(type) {
    if (!audioCtx || audioCtx.state !== 'running' || isMuted) return;
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    let now = audioCtx.currentTime;

    if (type === 'shoot') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.exponentialRampToValueAtTime(150, now + 0.08);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
        osc.start(now); osc.stop(now + 0.08);
    } else if (type === 'enemyshoot') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(280, now);
        osc.frequency.linearRampToValueAtTime(100, now + 0.1);
        gain.gain.setValueAtTime(0.06, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now); osc.stop(now + 0.1);
    } else if (type === 'explode') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.linearRampToValueAtTime(30, now + 0.25);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        osc.start(now); osc.stop(now + 0.25);
    } else if (type === 'powerup') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(900, now + 0.2);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        osc.start(now); osc.stop(now + 0.2);
    } else if (type === 'bomb') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.6);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
        osc.start(now); osc.stop(now + 0.6);
    }
}

function playMusicTick() {
    if (!audioCtx || audioCtx.state !== 'running' || gameState !== "PLAYING" || isMuted) return;
    let now = audioCtx.currentTime;

    let oscB = audioCtx.createOscillator();
    let gainB = audioCtx.createGain();
    oscB.type = 'sawtooth';
    oscB.frequency.setValueAtTime(bassNotes[musicStep % bassNotes.length], now);
    gainB.gain.setValueAtTime(0.07, now);
    gainB.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
    oscB.connect(gainB); gainB.connect(audioCtx.destination);
    oscB.start(now); oscB.stop(now + 0.09);

    if (musicStep % 2 === 0) {
        let oscL = audioCtx.createOscillator();
        let gainL = audioCtx.createGain();
        oscL.type = 'square';
        oscL.frequency.setValueAtTime(leadNotes[(musicStep / 2) % leadNotes.length], now);
        gainL.gain.setValueAtTime(0.03, now);
        gainL.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
        oscL.connect(gainL); gainL.connect(audioCtx.destination);
        oscL.start(now); oscL.stop(now + 0.08);
    }

    musicStep++;
}
setInterval(playMusicTick, 100);

let keys = {};
let joypadState = { x: 0, y: 0 };
let isShooting = false;

window.addEventListener("keydown", (e) => {
    initAudio();
    keys[e.key.toLowerCase()] = true;
    if (e.key === " " || e.key === "Enter") {
        if (gameState !== "PLAYING") startGame();
    }
    if (e.key.toLowerCase() === "b" && gameState === "PLAYING") triggerBomb();
});
window.addEventListener("keyup", (e) => { keys[e.key.toLowerCase()] = false; });

const joypadZone = document.getElementById("joypadZone");
const joystick = document.getElementById("joystick");

joypadZone.addEventListener("touchstart", handleJoyTouch, { passive: false });
joypadZone.addEventListener("touchmove", handleJoyTouch, { passive: false });
joypadZone.addEventListener("touchend", () => {
    joypadState = { x: 0, y: 0 };
    joystick.style.transform = `translate(0px, 0px)`;
}, { passive: false });

function handleJoyTouch(e) {
    e.preventDefault();
    initAudio();
    if (gameState !== "PLAYING") { startGame(); return; }
    
    let rect = joypadZone.getBoundingClientRect();
    let touch = e.touches[0];
    let centerX = rect.left + rect.width / 2;
    let centerY = rect.top + rect.height / 2;

    let deltaX = touch.clientX - centerX;
    let deltaY = touch.clientY - centerY;
    let distance = Math.hypot(deltaX, deltaY);
    let maxRadius = rect.width / 2;

    if (distance > maxRadius) {
        deltaX = (deltaX / distance) * maxRadius;
        deltaY = (deltaY / distance) * maxRadius;
    }

    joypadState.x = deltaX / maxRadius;
    joypadState.y = deltaY / maxRadius;
    joystick.style.transform = `translate(${deltaX}px, ${deltaY}px)`;
}

const btnShoot = document.getElementById("touchShoot");
const btnBomb = document.getElementById("touchBomb");

btnShoot.addEventListener("touchstart", (e) => {
    e.preventDefault(); initAudio();
    if (gameState !== "PLAYING") { startGame(); return; }
    isShooting = true;
    shootBullet();
});
btnShoot.addEventListener("touchend", () => { isShooting = false; });

btnBomb.addEventListener("touchstart", (e) => {
    e.preventDefault(); initAudio();
    if (gameState === "PLAYING") triggerBomb();
});

canvas.addEventListener("touchstart", (e) => {
    e.preventDefault(); initAudio();
    if (gameState !== "PLAYING") startGame();
});

function createPlayer() {
    return {
        x: canvas.width / 2,
        y: canvas.height - 70,
        radius: 14,
        speed: 5.0,
        weaponLevel: 1,
        bombs: 1,
        shootCooldown: 0
    };
}

function shootBullet() {
    if (!player || player.shootCooldown > 0) return;

    playSound('shoot');
    let lvl = player.weaponLevel;

    if (lvl === 1) {
        bullets.push({ x: player.x, y: player.y - 15, vx: 0, vy: -13, color: "#00ffff", size: 4 });
    } else if (lvl === 2) {
        bullets.push({ x: player.x - 8, y: player.y - 10, vx: 0, vy: -13, color: "#39ff14", size: 4 });
        bullets.push({ x: player.x + 8, y: player.y - 10, vx: 0, vy: -13, color: "#39ff14", size: 4 });
    } else if (lvl === 3) {
        bullets.push({ x: player.x, y: player.y - 15, vx: 0, vy: -13, color: "#ff007f", size: 5 });
        bullets.push({ x: player.x - 8, y: player.y - 10, vx: -2.5, vy: -12, color: "#ff007f", size: 5 });
        bullets.push({ x: player.x + 8, y: player.y - 10, vx: 2.5, vy: -12, color: "#ff007f", size: 5 });
    } else if (lvl === 4) {
        bullets.push({ x: player.x - 10, y: player.y - 10, vx: -1, vy: -13, color: "#ffff00", size: 5 });
        bullets.push({ x: player.x - 3, y: player.y - 15, vx: 0, vy: -14, color: "#ffff00", size: 5 });
        bullets.push({ x: player.x + 3, y: player.y - 15, vx: 0, vy: -14, color: "#ffff00", size: 5 });
        bullets.push({ x: player.x + 10, y: player.y - 10, vx: 1, vy: -13, color: "#ffff00", size: 5 });
    } else {
        bullets.push({ x: player.x, y: player.y - 15, vx: 0, vy: -15, color: "#a800ff", size: 6 });
        bullets.push({ x: player.x - 8, y: player.y - 12, vx: -2, vy: -14, color: "#a800ff", size: 6 });
        bullets.push({ x: player.x + 8, y: player.y - 12, vx: 2, vy: -14, color: "#a800ff", size: 6 });
        bullets.push({ x: player.x - 12, y: player.y - 8, vx: -4, vy: -12, color: "#a800ff", size: 6 });
        bullets.push({ x: player.x + 12, y: player.y - 8, vx: 4, vy: -12, color: "#a800ff", size: 6 });
    }

    player.shootCooldown = lvl >= 4 ? 9 : 11;
}

function triggerBomb() {
    if (player.bombs <= 0) return;
    player.bombs--;
    document.getElementById("bombVal").innerText = player.bombs;
    playSound('bomb');

    enemies.forEach(e => {
        createExplosion(e.x, e.y, e.color, 15);
        score += e.points;
    });
    enemies = [];
    enemyBullets = [];

    if (boss) {
        boss.hp -= 35;
        updateBossBar();
        createExplosion(boss.x, boss.y, "#ff007f", 20);
        if (boss.hp <= 0) defeatBoss();
    }

    ctx.fillStyle = "#ff007f";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function spawnBoss() {
    let maxHp = 50 + (waveLevel * 35);
    boss = {
        x: canvas.width / 2,
        y: -80,
        targetY: 80,
        radius: 35,
        hp: maxHp,
        maxHp: maxHp,
        color: waveLevel % 2 === 1 ? "#ff007f" : "#a800ff",
        vx: 2 + (waveLevel * 0.4),
        shootTimer: 0,
        shootRate: Math.max(45, 90 - waveLevel * 10)
    };
    document.getElementById("bossBar").style.display = "block";
    updateBossBar();
}

function updateBossBar() {
    if (!boss) return;
    let pct = Math.max(0, (boss.hp / boss.maxHp) * 100);
    document.getElementById("bossHpFill").style.width = `${pct}%`;
}

function bossShoot() {
    playSound('enemyshoot');
    let count = Math.min(6, 2 + waveLevel);
    let baseAngle = Math.atan2(player.y - boss.y, player.x - boss.x);
    let spread = 0.35;

    for (let i = 0; i < count; i++) {
        let angle = baseAngle - (spread / 2) + (spread / Math.max(1, count - 1)) * i;
        let speed = 3.0 + waveLevel * 0.3;
        enemyBullets.push({
            x: boss.x,
            y: boss.y + boss.radius,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            color: "#ff007f"
        });
    }
}

function enemyShoot(e) {
    playSound('enemyshoot');
    let angle = Math.atan2(player.y - e.y, player.x - e.x);
    let speed = 2.6 + waveLevel * 0.2;
    enemyBullets.push({
        x: e.x,
        y: e.y + e.radius,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        color: "#ff3300"
    });
}

function defeatBoss() {
    playSound('explode');
    createExplosion(boss.x, boss.y, boss.color, 40);
    score += 1000 * waveLevel;
    document.getElementById("scoreVal").innerText = score;

    spawnLoot(boss.x - 20, boss.y);
    spawnLoot(boss.x + 20, boss.y);

    boss = null;
    document.getElementById("bossBar").style.display = "none";

    waveLevel++;
    waveKills = 0;
    document.getElementById("levelVal").innerText = waveLevel;
}

function spawnEnemy() {
    if (boss || warningTimer > 0) return;

    const types = ['circle', 'square', 'star', 'rect', 'kamikaze'];
    let type = types[Math.floor(Math.random() * (waveLevel > 2 ? 5 : 3))];
    let radius = Math.random() * 6 + 12;
    let x = Math.random() * (canvas.width - radius * 2) + radius;

    let speed = Math.random() * (1.0 + waveLevel * 0.2) + 0.8;
    let color = "#00ffff";
    let hp = 1;
    let points = 100;
    let shootRate = 180 - (waveLevel * 20);

    if (type === 'square') { color = "#ff007f"; hp = 2; points = 200; shootRate = 160; }
    else if (type === 'star') { color = "#ffff00"; hp = 1; points = 150; speed *= 1.2; shootRate = 170; }
    else if (type === 'rect') { color = "#a800ff"; hp = 3; points = 300; radius = 18; shootRate = 140; }
    else if (type === 'kamikaze') { color = "#ff3300"; hp = 1; points = 250; speed *= 1.5; shootRate = 0; }

    enemies.push({ x, y: -20, radius, type, speed, color, hp, points, shootRate, shootTimer: Math.floor(Math.random() * 60) });
}

function spawnLoot(x, y) {
    const types = ['weapon', 'bomb'];
    let type = types[Math.random() < 0.80 ? 0 : 1];
    loots.push({ x, y, type, radius: 10, vy: 1.5 });
}

function createExplosion(x, y, color, count = 12) {
    for (let i = 0; i < count; i++) {
        let angle = Math.random() * Math.PI * 2;
        let speed = Math.random() * 4 + 1;
        particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            color,
            life: 25
        });
    }
}

function startGame() {
    player = createPlayer();
    boss = null;
    bullets = [];
    enemyBullets = [];
    enemies = [];
    particles = [];
    loots = [];
    score = 0;
    waveLevel = 1;
    waveKills = 0;
    warningTimer = 0;

    document.getElementById("scoreVal").innerText = 0;
    document.getElementById("levelVal").innerText = 1;
    document.getElementById("bombVal").innerText = player.bombs;
    document.getElementById("bossBar").style.display = "none";
    gameState = "PLAYING";
}

function update() {
    if (gameState !== "PLAYING") return;

    let moveX = 0, moveY = 0;
    if (keys['a'] || keys['arrowleft']) moveX -= 1;
    if (keys['d'] || keys['arrowright']) moveX += 1;
    if (keys['w'] || keys['arrowup']) moveY -= 1;
    if (keys['s'] || keys['arrowdown']) moveY += 1;

    moveX += joypadState.x;
    moveY += joypadState.y;

    player.x += moveX * player.speed;
    player.y += moveY * player.speed;

    player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
    player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));

    if (keys['k'] || keys[' '] || isShooting) shootBullet();
    if (player.shootCooldown > 0) player.shootCooldown--;

    stars.forEach(star => {
        star.y += star.speed;
        if (star.y > canvas.height) star.y = 0;
    });

    for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;
        if (b.y < -10 || b.x < 0 || b.x > canvas.width) {
            bullets.splice(i, 1);
        }
    }

    for (let i = enemyBullets.length - 1; i >= 0; i--) {
        let eb = enemyBullets[i];
        eb.x += eb.vx;
        eb.y += eb.vy;

        let dist = Math.hypot(player.x - eb.x, player.y - eb.y);
        if (dist < player.radius + 4) {
            triggerGameOver();
            return;
        }

        if (eb.y > canvas.height + 10 || eb.x < -10 || eb.x > canvas.width + 10) {
            enemyBullets.splice(i, 1);
        }
    }

    if (waveKills >= killsPerWave && !boss && warningTimer === 0) {
        warningTimer = 120;
        enemies = [];
    }

    if (warningTimer > 0) {
        warningTimer--;
        if (warningTimer === 0) spawnBoss();
    }

    if (boss) {
        if (boss.y < boss.targetY) boss.y += 2;

        boss.x += boss.vx;
        if (boss.x - boss.radius < 10 || boss.x + boss.radius > canvas.width - 10) {
            boss.vx *= -1;
        }

        boss.shootTimer++;
        if (boss.shootTimer >= boss.shootRate) {
            bossShoot();
            boss.shootTimer = 0;
        }

        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i];
            let hitDist = Math.hypot(b.x - boss.x, b.y - boss.y);
            if (hitDist < boss.radius + b.size) {
                boss.hp--;
                updateBossBar();
                bullets.splice(i, 1);
                createExplosion(b.x, b.y, boss.color, 3);
                if (boss.hp <= 0) {
                    defeatBoss();
                    break;
                }
            }
        }

        if (boss) {
            let dist = Math.hypot(player.x - boss.x, player.y - boss.y);
            if (dist < player.radius + boss.radius) {
                triggerGameOver();
                return;
            }
        }
    } else {
        let maxEnemiesOnScreen = Math.min(5, 3 + waveLevel);
        if (Math.random() < 0.025 && enemies.length < maxEnemiesOnScreen) spawnEnemy();
    }

    for (let eIdx = enemies.length - 1; eIdx >= 0; eIdx--) {
        let e = enemies[eIdx];
        if (e.type === 'kamikaze') {
            let angle = Math.atan2(player.y - e.y, player.x - e.x);
            e.x += Math.cos(angle) * e.speed;
            e.y += Math.sin(angle) * e.speed;
        } else {
            e.y += e.speed;

            if (e.shootRate > 0) {
                e.shootTimer++;
                if (e.shootTimer >= e.shootRate) {
                    enemyShoot(e);
                    e.shootTimer = 0;
                }
            }
        }

        let dist = Math.hypot(player.x - e.x, player.y - e.y);
        if (dist < player.radius + e.radius) {
            triggerGameOver();
            return;
        }

        for (let bIdx = bullets.length - 1; bIdx >= 0; bIdx--) {
            let b = bullets[bIdx];
            let hitDist = Math.hypot(b.x - e.x, b.y - e.y);
            if (hitDist < e.radius + b.size) {
                e.hp--;
                bullets.splice(bIdx, 1);
                createExplosion(b.x, b.y, e.color, 4);

                if (e.hp <= 0) {
                    playSound('explode');
                    createExplosion(e.x, e.y, e.color, 12);
                    score += e.points;
                    waveKills++;
                    document.getElementById("scoreVal").innerText = score;

                    if (Math.random() < 0.25) spawnLoot(e.x, e.y);
                    enemies.splice(eIdx, 1);
                    break;
                }
            }
        }

        if (e.y > canvas.height + 40) enemies.splice(eIdx, 1);
    }

    for (let lIdx = loots.length - 1; lIdx >= 0; lIdx--) {
        let l = loots[lIdx];
        l.y += l.vy;
        let dist = Math.hypot(player.x - l.x, player.y - l.y);
        if (dist < player.radius + l.radius) {
            playSound('powerup');
            if (l.type === 'weapon') {
                player.weaponLevel = Math.min(5, player.weaponLevel + 1);
            } else {
                player.bombs++;
                document.getElementById("bombVal").innerText = player.bombs;
            }
            loots.splice(lIdx, 1);
            continue;
        }
        if (l.y > canvas.height + 20) loots.splice(lIdx, 1);
    }

    for (let pIdx = particles.length - 1; pIdx >= 0; pIdx--) {
        let p = particles[pIdx];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(pIdx, 1);
    }
}

function triggerGameOver() {
    playSound('explode');
    createExplosion(player.x, player.y, "#00ffff", 30);
    gameState = "GAMEOVER";
    document.getElementById("bossBar").style.display = "none";

    if (score > highScore) {
        highScore = score;
        localStorage.setItem("freaker126_spacewars_high", highScore);
        document.getElementById("highVal").innerText = highScore;
    }
}

function render() {
    ctx.fillStyle = "#05050a";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#ffffff";
    stars.forEach(star => {
        ctx.fillRect(star.x, star.y, star.size, star.size);
    });

    if (gameState === "START") {
        drawGlowText("FREAKER126 NEON SPACE WARS", canvas.width / 2, canvas.height / 2 - 50, "#00ffff", "16px");
        drawGlowText("RIGHT THUMB: JOYPAD TO MOVE", canvas.width / 2, canvas.height / 2 - 10, "#39ff14", "11px");
        drawGlowText("LEFT THUMB: FIRE / BOMB", canvas.width / 2, canvas.height / 2 + 15, "#39ff14", "11px");
        drawGlowText("KEYS: WASD / ARROWS + SPACE", canvas.width / 2, canvas.height / 2 + 40, "#ffff00", "10px");
        drawGlowText("TAP TO START", canvas.width / 2, canvas.height / 2 + 80, "#ff007f", "16px");
        return;
    }

    if (gameState === "GAMEOVER") {
        drawGlowText("GAME OVER", canvas.width / 2, canvas.height / 2 - 40, "#ff007f", "28px");
        drawGlowText(`FINAL SCORE: ${score}`, canvas.width / 2, canvas.height / 2 + 10, "#00ffff", "16px");
        drawGlowText("TAP TO REMATCH", canvas.width / 2, canvas.height / 2 + 60, "#39ff14", "14px");
        return;
    }

    if (warningTimer > 0 && Math.floor(warningTimer / 10) % 2 === 0) {
        drawGlowText("WARNING: BOSS INCOMING!", canvas.width / 2, canvas.height / 2, "#ff007f", "18px");
    }

    bullets.forEach(b => {
        ctx.shadowBlur = 10;
        ctx.shadowColor = b.color;
        ctx.fillStyle = b.color;
        ctx.fillRect(b.x - (b.size / 2), b.y - 6, b.size, 10);
    });

    enemyBullets.forEach(eb => {
        ctx.shadowBlur = 8;
        ctx.shadowColor = eb.color;
        ctx.fillStyle = eb.color;
        ctx.beginPath();
        ctx.arc(eb.x, eb.y, 4, 0, Math.PI * 2);
        ctx.fill();
    });

    ctx.shadowBlur = 12;
    ctx.shadowColor = "#00ffff";
    ctx.strokeStyle = "#00ffff";
    ctx.lineWidth = 2;

    ctx.beginPath();
    ctx.moveTo(player.x, player.y - player.radius);
    ctx.lineTo(player.x - player.radius, player.y + player.radius);
    ctx.lineTo(player.x, player.y + player.radius - 5);
    ctx.lineTo(player.x + player.radius, player.y + player.radius);
    ctx.closePath();
    ctx.stroke();

    ctx.shadowColor = "#ff007f";
    ctx.fillStyle = "#ff007f";
    ctx.fillRect(player.x - 3, player.y + player.radius, 6, Math.random() * 6 + 3);

    if (boss) {
        ctx.shadowBlur = 18;
        ctx.shadowColor = boss.color;
        ctx.strokeStyle = boss.color;
        ctx.lineWidth = 3;

        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
            let angle = (i * 60) * Math.PI / 180;
            let px = boss.x + Math.cos(angle) * boss.radius;
            let py = boss.y + Math.sin(angle) * boss.radius;
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.stroke();

        ctx.fillStyle = boss.color;
        ctx.beginPath();
        ctx.arc(boss.x, boss.y, 14, 0, Math.PI * 2);
        ctx.fill();
    }

    enemies.forEach(e => {
        ctx.shadowBlur = 10;
        ctx.shadowColor = e.color;
        ctx.strokeStyle = e.color;
        ctx.lineWidth = 2;

        if (e.type === 'circle' || e.type === 'kamikaze') {
            ctx.beginPath();
            ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
            ctx.stroke();
        } else if (e.type === 'square') {
            ctx.strokeRect(e.x - e.radius, e.y - e.radius, e.radius * 2, e.radius * 2);
        } else if (e.type === 'rect') {
            ctx.strokeRect(e.x - e.radius * 1.2, e.y - e.radius * 0.7, e.radius * 2.4, e.radius * 1.4);
        } else if (e.type === 'star') {
            ctx.beginPath();
            for (let i = 0; i < 5; i++) {
                ctx.lineTo(Math.cos((18 + i * 72) * Math.PI / 180) * e.radius + e.x,
                           -Math.sin((18 + i * 72) * Math.PI / 180) * e.radius + e.y);
                ctx.lineTo(Math.cos((54 + i * 72) * Math.PI / 180) * (e.radius / 2) + e.x,
                           -Math.sin((54 + i * 72) * Math.PI / 180) * (e.radius / 2) + e.y);
            }
            ctx.closePath();
            ctx.stroke();
        }
    });

    loots.forEach(l => {
        ctx.shadowBlur = 8;
        let color = l.type === 'weapon' ? "#39ff14" : "#ff007f";
        ctx.shadowColor = color;
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(l.x, l.y, l.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#000";
        ctx.font = "bold 9px monospace";
        ctx.textAlign = "center";
        ctx.fillText(l.type === 'weapon' ? "W" : "B", l.x, l.y + 3);
    });

    particles.forEach(p => {
        ctx.shadowBlur = 5;
        ctx.shadowColor = p.color;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 2, 2);
    });
}

function drawGlowText(text, x, y, color, size = "16px") {
    ctx.shadowBlur = 8;
    ctx.shadowColor = color;
    ctx.fillStyle = color;
    ctx.font = `bold ${size} 'Courier New'`;
    ctx.textAlign = "center";
    ctx.fillText(text, x, y);
}

function loop() {
    update();
    render();
    requestAnimationFrame(loop);
}

loop();
</script>
